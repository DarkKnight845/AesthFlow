[project]
name = "aesthflow"
version = "0.1.0"
description = "Multi-agent orchestration backend (LangGraph-based)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "docker>=7.1.0",
    "fastapi>=0.115.0",
    "langchain>=0.3.0",
    # "langchain-openai>=0.2.0",  # temporarily disabled while using Gemini
    "langchain-google-genai>=4.0.0",
    "langgraph>=0.2.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "structlog>=24.4.0",
    "tavily-python>=0.5.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]